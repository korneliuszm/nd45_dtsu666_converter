[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nd45_dtsu666"
version = "0.2.0"
description = "Modbus bridge: Lumel ND45 (TCP) -> DTSU666 (RTU or TCP, config-selectable) for Sigenergy"
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.6,<3.7",
    "pydantic>=2,<3",
    "pyserial>=3.5",
    # Client for modbus-hub (source.via_hub). Only the runtime is needed --
    # the stubs in src/nd45_dtsu666/hubpb are generated and committed, so
    # grpcio-tools is a developer dependency, not a deployment one.
    "grpcio>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.16.0", "grpcio-tools>=1.60"]

[project.scripts]
nd45-dtsu666 = "nd45_dtsu666.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated by protoc (scripts/gen_hub_stubs.sh); not ours to style.
extend-exclude = ["src/nd45_dtsu666/hubpb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
